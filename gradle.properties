org.gradle.jvmargs=-Xmx2G -Dfile.encoding=UTF-8
org.gradle.parallel=true
# IntelliJ IDEA is not yet fully compatible with the configuration cache (fabric-loom#1349).
org.gradle.configuration-cache=false

# Toolchain — verified against meta.fabricmc.net and piston-meta on 2026-07-28.
# Minecraft 26.2 requires Java 25 (javaVersion component "java-runtime-epsilon").
minecraft_version=26.2
loader_version=0.19.3
loom_version=1.17.17
fabric_api_version=0.155.2+26.2

# The mod version tracks the Minecraft version it targets, so the file name alone says what it
# runs on: primeslots-26.2.jar is the 26.2 build. For a second build against the same Minecraft
# version, append a counter — 26.2.1, 26.2.2 — which keeps sorting correct.
mod_version=26.2
maven_group=net.primeblocks
archives_base_name=primeslots
