name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Minecraft 26.2 targets Java 25, and Loom compiles with --release 25.
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: ./gradlew build --stacktrace

      # Read the version out of gradle.properties so the artifact name matches the jar.
      - name: Read mod version
        id: mod
        run: echo "version=$(grep '^mod_version=' gradle.properties | cut -d= -f2)" >> "$GITHUB_OUTPUT"

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: primeslots-${{ steps.mod.outputs.version }}
          # The sources jar is built too; only the mod itself is wanted here.
          path: build/libs/primeslots-${{ steps.mod.outputs.version }}.jar
          if-no-files-found: error

  release:
    # Tag pushes publish a release; ordinary pushes only leave a build artifact.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*.jar
          generate_release_notes: true
